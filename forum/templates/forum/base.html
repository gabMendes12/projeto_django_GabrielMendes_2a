{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fórum Impacta ESG{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
    <header class="cabecalho">
        <div class="largura">
            <a class="marca" href="{% url 'forum:index' %}">Impacta ESG</a>
            <nav class="navegacao" aria-label="Navegação principal">
                <a href="{% url 'forum:index' %}">Perguntas</a>
                <a href="{% url 'forum:inserir_pergunta' %}">Criar pergunta</a>
                <a href="{% url 'esg:home' %}">Sobre o projeto</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
